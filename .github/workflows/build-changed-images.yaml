name: Build Changed Container Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-changed-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # andymckay/cancel-action cancels the workflow run through the Actions
      # API (POST /repos/{owner}/{repo}/actions/runs/{id}/cancel), which
      # needs actions: write. Without it the empty-matrix path fails with
      # "Resource not accessible by integration" and the run goes red.
      actions: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      empty: ${{ steps.matrix.outputs.empty }}

    steps:
    - uses: actions/checkout@v7
      name: pulling the branch
      with:
        fetch-depth: 50

    - name: Get Changes
      id: changes
      uses: jitterbit/get-changed-files@v1
      with:
        format: 'json'

    - name: Storing changed/removed files listings
      id: matrix
      run: |
        set -x
        jq -rc '{"images": [ (.[] | select(test("^[a-zA-Z0-9_-]*\/")) | split("/") | .[0])] | sort | unique }' <<<'${{ steps.changes.outputs.added_modified }}' >> images.list
        echo "List of images:"
        cat images.list

        if [ "$(jq '.images | length' images.list)" == "0" ]; then
          echo "empty=true" >> $GITHUB_OUTPUT
        else
          echo "empty=false" >> $GITHUB_OUTPUT
        fi
        echo "matrix=$(cat images.list)" >> $GITHUB_OUTPUT

    # No image directory changed, so there is nothing to build. The build job
    # below is skipped for an empty matrix, which keeps the run green instead
    # of cancelling it and avoids the actions: write permission that
    # andymckay/cancel-action needs in order to cancel the run.

  build-images:
    needs: generate-changed-matrix
    if: ${{ needs.generate-changed-matrix.outputs.empty != 'true' }}
    # A reusable workflow can only narrow the permissions granted here, so the
    # GHCR push needs packages: write on the caller as well.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{fromJson( needs.generate-changed-matrix.outputs.matrix )}}
      fail-fast: false
    uses: ./.github/workflows/build-image.yaml
    with:
      image-name: ${{matrix.images}}
      push: ${{ github.event_name == 'push' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
