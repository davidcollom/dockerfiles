name: Build Image

on:
  workflow_dispatch:
    inputs:
      image-name:
        description: "Image/Dir to build"
        type: string
        required: true
      push:
        description: "Push or Not the image"
        type: boolean
        default: false
        required: true

  workflow_call:
    inputs:
      image-name:
        description: "Image/Dir to build"
        type: string
        required: true
      push:
        description: "Push or Not the image"
        type: boolean
        default: false
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
        description: Docker hub username
      DOCKERHUB_TOKEN:
        required: true
        description: Docker hub Token

permissions:
  contents: read

jobs:
  build_images:
    runs-on: ubuntu-latest
    # The GHCR push needs packages: write on GITHUB_TOKEN. Without it the
    # registry rejects the manifest upload with "permission_denied:
    # read_package" and the Docker Hub push never runs.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Metadata
        id: set_meta
        working-directory: "./${{ inputs.image-name }}/"
        run: |
          pwd
          echo VERSION=$(cat VERSION) >> $GITHUB_OUTPUT
          if [ -e PLATFORMS ]; then
            echo PLATFORMS=$(cat PLATFORMS | tr '\n' ',' ) >> $GITHUB_OUTPUT
          else
            echo "PLATFORMS=" >> $GITHUB_OUTPUT
          fi

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ inputs.image-name }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # GITHUB_TOKEN can only publish to a package that is linked to this
      # repository. If that is not the case, set the GHCR_TOKEN repository
      # secret to a classic token with write:packages for the account owner and
      # it is used instead.
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Needed as part of https://github.com/docker/buildx/issues/495#issuecomment-1043341496
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{steps.set_meta.outputs.PLATFORMS}}

      # Docker Hub and GHCR are pushed in separate steps so a registry
      # authentication problem in one of them cannot stop the other from
      # receiving the image. The second build reuses the exported build cache
      # and only has to upload the manifests.
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: "${{inputs.image-name}}/"
          push: ${{inputs.push}}
          pull: true
          build-args: VERSION=${{steps.set_meta.outputs.VERSION}}
          platforms: ${{steps.set_meta.outputs.PLATFORMS}}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{inputs.image-name}}:${{steps.set_meta.outputs.VERSION}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: "${{inputs.image-name}}/"
          push: ${{inputs.push}}
          pull: true
          build-args: VERSION=${{steps.set_meta.outputs.VERSION}}
          platforms: ${{steps.set_meta.outputs.PLATFORMS}}
          tags: ghcr.io/davidcollom/${{inputs.image-name}}:${{steps.set_meta.outputs.VERSION}}
          cache-from: type=gha
